name: main-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python: [py310, py311, py312, py313, py314]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: 🧪 Run Tox Python Tests
        run: uvx --with tox-uv tox -e ${{ matrix.python }}

  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: 🔍 Other Tox Checks
        run: uvx --with tox-uv tox -e ruff -e check-wheel-contents

      - name: 📦 Upload Wheel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel-output
          path: .tox/check-wheel-contents/dist/
